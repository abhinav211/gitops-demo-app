<!DOCTYPE html>
<html>
<head>
    <title>GitOps Demo</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align:center;
            background:#f4f4f4;
            margin:0;
        }

        .banner{
            background:#d32f2f;
            color:white;
            padding:18px;
            font-size:30px;
            font-weight:bold;
        }

        .card{
            margin:60px auto;
            width:500px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.2);
        }

        h2{
            color:#1976d2;
        }

        .version{
            font-size:24px;
            color:#d32f2f;
            font-weight:bold;
        }

        .footer{
            margin-top:20px;
            color:#777;
        }
    </style>

</head>

<body>

<div class="banner">
🚀 CANARY RELEASE 🚀
</div>

<div class="card">

<h1>Enterprise GitOps Demo</h1>

<h2>Environment</h2>
<p>{{ environment }}</p>

<h2>Version</h2>
<p class="version">{{ version }}</p>

<h2>Deployment Strategy</h2>
<p>{{ strategy }}</p>

<div class="footer">
Powered by Kubernetes • Argo CD • Argo Rollouts • Traefik
</div>

</div>

</body>
</html>
